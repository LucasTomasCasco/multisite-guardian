name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - name: Syntax check
        run: |
          status=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || status=1
          done < <(find . -name '*.php' -not -path './vendor/*')
          exit $status

  standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpcs

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit -c phpunit.xml.dist

  integration:
    name: Integration (WordPress ${{ matrix.wordpress }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest supported WordPress on MySQL.
          - wordpress: "6.8.3"
            wp_phpunit: "6.8.*"
            database: "mysql:8.0"
          # Declared minimum (Requires at least: 6.5) on MySQL.
          - wordpress: "6.5.5"
            wp_phpunit: "6.5.*"
            database: "mysql:8.0"
          # Same WordPress on MariaDB, which many hosts run.
          - wordpress: "6.8.3"
            wp_phpunit: "6.8.*"
            database: "mariadb:10.11"
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
        ports:
          - 3306:3306
    env:
      WP_ABSPATH: ${{ github.workspace }}/.wordpress
      WP_TESTS_DB_HOST: 127.0.0.1
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_NAME: wordpress_test
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli
          tools: composer:v2

      - name: Download WordPress ${{ matrix.wordpress }}
        run: |
          curl -sSL "https://wordpress.org/wordpress-${{ matrix.wordpress }}.tar.gz" -o wordpress.tar.gz
          mkdir -p "$WP_ABSPATH"
          tar -xzf wordpress.tar.gz -C "$WP_ABSPATH" --strip-components=1

      - name: Create test database
        run: mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS wordpress_test"

      - run: composer install --no-interaction --no-progress --prefer-dist

      # The WordPress test library must match the core version under test.
      - name: Match test library to WordPress ${{ matrix.wordpress }}
        run: composer require --dev "wp-phpunit/wp-phpunit:${{ matrix.wp_phpunit }}" --no-interaction --no-progress

      - run: vendor/bin/phpunit -c phpunit-integration.xml.dist

  e2e:
    name: End-to-end (Playwright) and CLI checks
    runs-on: ubuntu-latest
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
        ports:
          - 3306:3306
    env:
      WP_VERSION: "6.8.3"
      WP_PATH: ${{ github.workspace }}/.e2e-wordpress
      E2E_URL: http://127.0.0.1:8088
      E2E_BASE_URL: http://127.0.0.1:8088
      E2E_ADMIN_USER: admin
      E2E_ADMIN_PASSWORD: guardian-ci-only
      E2E_SITE_ADMIN_USER: siteadmin
      E2E_SITE_ADMIN_PASSWORD: guardian-ci-only
      E2E_SITE_PATH: /editorial
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli
          tools: wp-cli

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Download WordPress
        run: |
          curl -sSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o wordpress.tar.gz
          mkdir -p "$WP_PATH"
          tar -xzf wordpress.tar.gz -C "$WP_PATH" --strip-components=1

      - name: Create database
        run: mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS wordpress_e2e"

      - name: Build the Multisite network
        run: sh scripts/ci-network.sh "$WP_PATH" "$GITHUB_WORKSPACE"

      - name: Start the web server
        run: |
          nohup php -S 127.0.0.1:8088 -t "$WP_PATH" "$WP_PATH/router.php" > "$RUNNER_TEMP/php-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8088/wp-login.php > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/php-server.log"
          exit 1

      - name: CLI checks
        run: sh scripts/ci-cli-checks.sh "$WP_PATH"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

